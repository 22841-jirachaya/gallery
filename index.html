<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>แกลเลอรีรูปภาพของฉัน - Wednesday Theme</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Sarabun:wght@300;400;600&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Sarabun', sans-serif;
            background: radial-gradient(circle at center, #1b112c, #0a0612, #000000);
            color: #d1d5db;
            min-height: 100vh;
        }

        /* ส่วนหัว */
        header {
            text-align: center;
            padding: 60px 20px 30px;
            background: linear-gradient(to bottom, rgba(0,0,0,0.8), transparent);
        }

        header h1 {
            font-family: 'Cinzel', serif;
            font-size: 40px;
            color: #bd93f9;
            letter-spacing: 2px;
            text-shadow: 0 0 12px rgba(189, 147, 249, 0.4);
            margin-bottom: 10px;
        }

        header p {
            font-size: 16px;
            color: #8b92a5;
            font-style: italic;
        }

        /* แกลเลอรี */
        .gallery {
            max-width: 1100px;
            margin: 0 auto;
            padding: 30px 20px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 30px;
        }

        /* การ์ดสไตล์กอทิก */
        .card {
            background: #120e1a;
            border: 1px solid #2d2240;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
            transition: all 0.4s ease;
            position: relative;
        }

        .card:hover {
            transform: translateY(-8px);
            border-color: #8b5cf6;
            box-shadow: 0 12px 35px rgba(139, 92, 246, 0.25);
        }

        /* รูปภาพ */
        .card img {
            width: 100%;
            height: 260px;
            object-fit: cover;
            display: block;
            filter: grayscale(20%) contrast(110%);
            transition: transform 0.5s ease, filter 0.5s ease;
        }

        .card:hover img {
            transform: scale(1.06);
            filter: grayscale(0%) contrast(100%);
        }

        /* ข้อความ */
        .content {
            padding: 22px;
            background: linear-gradient(180deg, #120e1a 0%, #0d0a14 100%);
        }

        .content h2 {
            font-family: 'Cinzel', serif;
            font-size: 22px;
            color: #e2e8f0;
            margin-bottom: 10px;
            border-bottom: 1px solid #2d2240;
            padding-bottom: 8px;
        }

        /* ตกแต่งพิเศษสำหรับ Enid (คู่ปรับโทนพาสเทล) */
        .card.enid-card {
            border-color: #4a2040;
        }
        
        .card.enid-card:hover {
            border-color: #ff79c6;
            box-shadow: 0 12px 35px rgba(255, 121, 198, 0.25);
        }

        .card.enid-card h2 {
            color: #ff79c6;
        }

        .content p {
            font-size: 14px;
            line-height: 1.7;
            color: #94a3b8;
        }

        /* ส่วนท้าย */
        footer {
            text-align: center;
            padding: 30px 20px;
            margin-top: 50px;
            background: #07040d;
            border-top: 1px solid #1f172e;
            color: #64748b;
            font-size: 14px;
        }

        footer p {
            margin: 4px 0;
        }

        /* Responsive Design */
        @media (max-width: 900px) {
            .gallery {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 600px) {
            header h1 {
                font-size: 30px;
            }

            .gallery {
                grid-template-columns: 1fr;
            }

            .card img {
                height: 240px;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>🕷️ แกลเลอรีรูปภาพของฉัน</h1>
        <p>ยินดีต้อนรับสู่ Nevermore Academy —
